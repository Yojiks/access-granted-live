    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57ffc3"/>
      <stop offset="1" stop-color="#11bfff"/>
    </linearGradient>
    <pattern id="diagonal" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
