      <stop offset="0" stop-color="#020705"/>
      <stop offset="0.5" stop-color="#03120d"/>
      <stop offset="1" stop-color="#020706"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd45a"/>
      <stop offset="0.38" stop-color="#c8f26a"/>
